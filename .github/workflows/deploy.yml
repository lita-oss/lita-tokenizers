name: Release CLI
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    env:
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Set up Python for musl build tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install musl build tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: python -m pip install cargo-zigbuild

      - name: Build binary
        run: |
          if [[ "$TARGET" == *-musl ]]; then
            cargo zigbuild --locked --target "$TARGET" -p lita-tokenizers-cli --profile release-minified
          else
            cargo build --locked --target "$TARGET" -p lita-tokenizers-cli --profile release-minified
          fi

      - name: Smoke test binary
        run: |
          "target/$TARGET/release-minified/lita-tokenizers-cli" --version

      - name: Package binary and licenses
        run: |
          package="lita-tokenizers-cli-$TARGET"
          mkdir -p "$package/license/"{kytea,lita-tokenizers-cli,mecab}
          cp "target/$TARGET/release-minified/lita-tokenizers-cli" "$package/"
          cp LICENSE-APACHE LICENSE-MIT "$package/license/lita-tokenizers-cli/"
          cp crates/kytea-sys/kytea-src/COPYING "$package/license/kytea/"
          cp crates/mecab-sys/mecab-src/{COPYING,BSD} "$package/license/mecab/"
          tar -czf "$package.tar.gz" "$package"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: lita-tokenizers-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: ./release-assets
          merge-multiple: true

      - name: Verify all four release assets
        run: |
          targets=(
            x86_64-unknown-linux-musl
            x86_64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
          )
          for target in "${targets[@]}"; do
            test -s "release-assets/lita-tokenizers-cli-$target.tar.gz"
          done
          assets=(release-assets/*.tar.gz)
          test "${#assets[@]}" -eq 4

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: ./release-assets/*.tar.gz
          fail_on_unmatched_files: true
