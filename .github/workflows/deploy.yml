name: Release CLI
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select supported Python versions and assets
        id: matrix
        run: python3 .github/release/matrix.py >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: Build ${{ matrix.target }}-${{ matrix.python_tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      PYTHON_VERSION: ${{ matrix.python }}
      PYTHON_TAG: ${{ matrix.python_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Set up matching CPython
        if: matrix.target != 'x86_64-unknown-linux-musl'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Build and package native binary
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: bash .github/release/build.sh

      - name: Smoke test native archive with spaCy
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: bash .github/release/smoke.sh

      - name: Prepare native musl build environment
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker build --platform linux/amd64 \
            --build-arg "PYTHON_VERSION=$PYTHON_VERSION" \
            --tag "lita-release:$PYTHON_TAG" --file .github/release/musl.Dockerfile .github/release

      - name: Build, package, and smoke test musl binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" --env CARGO_HOME=/tmp/cargo \
            --volume "$PWD:/work" --env TARGET --env PYTHON_VERSION --env PYTHON_TAG \
            "lita-release:$PYTHON_TAG" bash -c \
              'bash .github/release/build.sh && bash .github/release/smoke.sh'

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}-${{ matrix.python_tag }}
          path: lita-tokenizers-cli-${{ matrix.target }}-${{ matrix.python_tag }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: ./release-assets
          merge-multiple: true

      - name: Verify all target and Python combinations
        env:
          EXPECTED_PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = set(json.loads(os.environ["EXPECTED_PACKAGES"]))
          actual = {path.name for path in Path("release-assets").iterdir()}
          assert actual == expected, f"Missing: {expected - actual}; unexpected: {actual - expected}"
          for name in expected:
              assert (Path("release-assets") / name).stat().st_size > 0, name
          PY

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: ./release-assets/*.tar.gz
          fail_on_unmatched_files: true
