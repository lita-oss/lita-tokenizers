[package]
name = "lita-tokenizers"
version = "0.2.2"

description = "High-level APIs to utilize tokenizers that are working on the LiTA app."

edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["decode", "kytea", "mecab", "tokio"]

decode = ["tokenizers-utils/decode"]

kytea = ["dep:tokenizers-kytea"]
mecab = ["dep:tokenizers-mecab"]

tokio = ["tokenizers-utils/tokio-io", "tokenizers-utils/tokio-fs", "dep:futures-util"]

[dependencies]
tokenizers-core.workspace = true
tokenizers-utils = { workspace = true, features = ["sync-io", "sync-fs"] }

tokenizers-kytea = { workspace = true, optional = true }
tokenizers-mecab = { workspace = true, optional = true }
tokenizers-whitespace = { workspace = true }

futures-util = { workspace = true, optional = true }

[dependencies.tokio]
workspace = true
features = ["fs", "io-std", "io-util"]
