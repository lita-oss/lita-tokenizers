[paths]
train = null
dev = null

[system]
seed = 0

[nlp]
lang = "en"
pipeline = ["m", "p"]
batch_size = 1

[components]

[components.m]
factory = "morphologizer"

[components.m.model]
@architectures = "spacy.Tagger.v2"

[components.m.model.tok2vec]
@layers = "chain.v1"

[components.m.model.tok2vec.*]

[components.m.model.tok2vec.*.extract]
@layers = "spacy.FeatureExtractor.v1"
columns = ["ORTH"]

[components.m.model.tok2vec.*.embed]
@layers = "with_array.v1"

[components.m.model.tok2vec.*.embed.layer]
@layers = "HashEmbed.v1"
nO = 1
nV = 3
column = 0
seed = 31

[components.p]
factory = "parser"
min_action_freq = 1

[components.p.model]
@architectures = "spacy.TransitionBasedParser.v2"
hidden_width = 4
maxout_pieces = 1

[components.p.model.tok2vec]
@layers = "chain.v1"

[components.p.model.tok2vec.*]

[components.p.model.tok2vec.*.extract]
@layers = "spacy.FeatureExtractor.v1"
columns = ["POS"]

[components.p.model.tok2vec.*.embed]
@layers = "with_array.v1"

[components.p.model.tok2vec.*.embed.layer]
@layers = "HashEmbed.v1"
nO = 1
nV = 3
column = 0
seed = 31

[training]
dropout = 0.0
patience = 0
max_steps = 4000
eval_frequency = 200
annotating_components = ["m"]

[training.optimizer]
@optimizers = "Adam.v1"
learn_rate = 0.02
L2 = 0.0
